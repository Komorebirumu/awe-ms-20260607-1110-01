<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4e54c8; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8f94fb; stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe; stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#gradient1)" />

  <!-- Planetoid -->
  <circle cx="400" cy="300" r="150" fill="url(#gradient2)" filter="url(#glow)" />
  <circle cx="400" cy="300" r="140" fill="rgba(255,255,255,0.1)" />
  <circle cx="400" cy="300" r="130" fill="rgba(0,0,0,0.2)" />

  <!-- Procedural Generation Icon -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="80" height="80" rx="10" ry="10" fill="#ffffff" opacity="0.8" />
    <path d="M 20 20 L 20 60 L 60 60 L 60 20 Z" fill="#4facfe" />
    <circle cx="40" cy="40" r="15" fill="#00f2fe" />
    <path d="M 30 30 L 30 50 L 50 50 L 50 30 Z" fill="rgba(255,255,255,0.5)" />
    <line x1="25" y1="25" x2="35" y2="35" stroke="#ffffff" stroke-width="2" />
    <line x1="45" y1="25" x2="55" y2="35" stroke="#ffffff" stroke-width="2" />
    <line x1="25" y1="45" x2="35" y2="55" stroke="#ffffff" stroke-width="2" />
    <line x1="45" y1="45" x2="55" y2="55" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- AI Brain Icon -->
  <g transform="translate(600, 100)">
    <rect x="0" y="0" width="80" height="80" rx="10" ry="10" fill="#ffffff" opacity="0.8" />
    <path d="M 10 40 C 10 20, 70 20, 70 40 C 70 60, 10 60, 10 40 Z" fill="#4e54c8" />
    <circle cx="40" cy="40" r="15" fill="#8f94fb" />
    <path d="M 30 35 Q 40 30 50 35" fill="none" stroke="#ffffff" stroke-width="2" />
    <path d="M 30 45 Q 40 50 50 45" fill="none" stroke="#ffffff" stroke-width="2" />
    <circle cx="40" cy="25" r="3" fill="#ffffff" />
    <circle cx="40" cy="55" r="3" fill="#ffffff" />
  </g>

  <!-- Text "AI-Driven Niche" -->
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="bold">AI-Driven Niche</text>

  <!-- Text "Procedural Planet Visualizer" -->
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="25" fill="#cccccc" text-anchor="middle">Procedural Planet Visualizer</text>

  <!-- Abstract geometric patterns in background (subtle) -->
  <g opacity="0.1">
    <circle cx="50" cy="50" r="30" fill="#ffffff" />
    <rect x="700" y="500" width="50" height="50" fill="#ffffff" transform="rotate(45 725 525)" />
    <polygon points="150,400 180,450 120,450" fill="#ffffff" />
    <circle cx="650" cy="150" r="20" fill="#ffffff" />
  </g>

</svg>